<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- favicon.ico was referenced but never existed, so every page load 404'd. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7263" />
    <meta name="description" content="Inventory and point-of-sale management for retail shops" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Fonts are self-hosted (see src/styles/fonts.css). A shop on a poor
         connection used to load the whole app and still get no usable type,
         and the Bengali interface had no Bengali font at all. -->
    <title>Domingo Shop — Inventory</title>
    <style>
      /* Paint the shell background before React mounts, so a slow first load
         does not flash white on a dark-mode till. */
      html { background: #f6f7f9; }
      @media (prefers-color-scheme: dark) { html { background: #0e1116; } }
      html[data-theme="light"] { background: #f6f7f9; }
      html[data-theme="dark"]  { background: #0e1116; }
    </style>
  </head>
  <body>
    <noscript>
      This application needs JavaScript enabled. Please turn it on in your browser settings and reload the page.
    </noscript>
    <div id="root"></div>
  </body>
</html>
