<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- favicon.ico was referenced but never existed, so every page load 404'd. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Inventory and point-of-sale management for retail shops" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Domingo Shop — Inventory</title>
    <style>
      /* Paint the shell background before React mounts, so a slow first load
         does not flash white on a dark-mode till. */
      html { background: #f8fafc; }
      @media (prefers-color-scheme: dark) { html { background: #0f172a; } }
      html[data-theme="light"] { background: #f8fafc; }
      html[data-theme="dark"]  { background: #0f172a; }
    </style>
  </head>
  <body>
    <noscript>
      This application needs JavaScript enabled. Please turn it on in your browser settings and reload the page.
    </noscript>
    <div id="root"></div>
  </body>
</html>
